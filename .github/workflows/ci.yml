name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test core
        run: cargo test -p srename-core --locked
      - name: Lint core
        run: cargo clippy -p srename-core --all-targets --locked -- -D warnings

  macos:
    name: Workspace checks (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
